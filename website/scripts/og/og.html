<!doctype html>
<!-- Social preview image (1200x630). Rendered to public/og-it.png and public/og-en.png by scripts/og.mjs (?lang=en). -->
<html>
  <head>
    <meta charset="UTF-8" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        position: relative;
        font-family: Inter, 'Segoe UI', sans-serif;
        background: #020617;
        color: #fff;
      }
      .grid {
        position: absolute; inset: 0;
        background-image: linear-gradient(to right, rgb(148 163 184 / 0.07) 1px, transparent 1px),
          linear-gradient(to bottom, rgb(148 163 184 / 0.07) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(ellipse at 30% 40%, black, transparent 75%);
      }
      .glow { position: absolute; border-radius: 9999px; filter: blur(90px); }
      .glow.a { width: 620px; height: 420px; left: -120px; top: -160px; background: rgb(249 115 22 / 0.35); }
      .glow.b { width: 520px; height: 380px; right: -140px; bottom: -180px; background: rgb(249 115 22 / 0.22); }
      .left { position: absolute; left: 72px; top: 64px; width: 600px; }
      .brand { display: flex; align-items: center; gap: 16px; font-size: 26px; font-weight: 800; }
      .brand img { width: 60px; height: 60px; }
      .brand span { color: #f97316; }
      h1 { margin-top: 44px; font-size: 64px; line-height: 1.04; font-weight: 900; letter-spacing: -0.035em; }
      h1 em { font-style: normal; color: #f97316; }
      p.sub { margin-top: 24px; font-size: 24px; line-height: 1.45; color: #94a3b8; max-width: 540px; }
      p.sub code { font-family: 'Cascadia Mono', Consolas, monospace; color: #fdba74; font-size: 21px; }
      .chips { position: absolute; left: 72px; bottom: 60px; display: flex; gap: 12px; align-items: center; }
      .games { display: flex; margin-right: 8px; }
      .games img { width: 52px; height: 52px; border-radius: 9999px; background: #fff; border: 3px solid #020617; }
      .games img + img { margin-left: -14px; }
      .chip {
        padding: 9px 16px; border-radius: 9999px; font-size: 18px; font-weight: 600;
        border: 1px solid rgb(249 115 22 / 0.4); background: rgb(249 115 22 / 0.1); color: #fdba74;
      }
      .shot {
        position: absolute; left: 700px; top: 92px; width: 720px;
        border-radius: 18px; overflow: hidden; border: 1px solid #1e293b; background: #0f172a;
        box-shadow: 0 40px 80px rgb(0 0 0 / 0.6), 0 0 0 1px rgb(249 115 22 / 0.15);
        transform: perspective(1400px) rotateY(-14deg) rotateX(4deg);
        transform-origin: left center;
      }
      .bar { display: flex; gap: 8px; padding: 12px 16px; border-bottom: 1px solid #1e293b; }
      .bar i { width: 12px; height: 12px; border-radius: 9999px; background: #334155; }
      .shot img { display: block; width: 100%; }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow a"></div>
    <div class="glow b"></div>

    <div class="left">
      <div class="brand"><img src="../../public/icon.png" alt="" /><div>ETS2 <span>Package Sync</span></div></div>
      <h1 id="title"></h1>
      <p class="sub" id="sub"></p>
    </div>

    <div class="chips">
      <div class="games">
        <img src="../../src/assets/ets2.png" alt="" />
        <img src="../../src/assets/ats.png" alt="" />
      </div>
      <div class="chip">ETS2 · ATS</div>
      <div class="chip">Windows</div>
      <div class="chip">Open source</div>
    </div>

    <div class="shot">
      <div class="bar"><i></i><i></i><i></i></div>
      <img src="../../src/assets/shots/server-dashboard-dark.png" alt="" />
    </div>

    <script>
      const en = new URLSearchParams(location.search).get('lang') === 'en'
      document.getElementById('title').innerHTML = en
        ? 'Your server mod list, <em>always up to date.</em>'
        : 'La mod list del tuo server, <em>sempre aggiornata.</em>'
      document.getElementById('sub').innerHTML = en
        ? 'Run <code>export_server_packages</code> in game. The dedicated server updates and restarts by itself, through GitHub.'
        : 'Esegui <code>export_server_packages</code> in gioco. Il server dedicato si aggiorna e si riavvia da solo, tramite GitHub.'
    </script>
  </body>
</html>
