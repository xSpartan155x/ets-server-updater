<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f97316" />
    <meta name="author" content="xSpartan155x" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <!-- meta:start (rewritten for every page by scripts/pages.mjs) -->
    <title>ETS2 Package Sync</title>
    <meta name="description" content="Sincronizza automaticamente i pacchetti dei server dedicati di Euro Truck Simulator 2 e American Truck Simulator tramite GitHub." />
    <!-- meta:end -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      try {
        var t = localStorage.getItem('theme') || 'system'
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body class="bg-white text-slate-700 antialiased dark:bg-slate-950 dark:text-slate-300">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
